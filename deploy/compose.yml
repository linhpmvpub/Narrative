services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      SEND_NOTIFICATIONS: "false"
      ALLOW_SYNTHETIC_LIVE: "false"
      LLM_MODE: none
    secrets:
      - database_url
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    networks: [private]
  proxy:
    image: nginx:stable-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    secrets:
      - tls_certificate
      - tls_key
    depends_on: [api]
    networks: [private, edge]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    mem_limit: 128m
    pids_limit: 64
networks:
  edge: {}
  private:
    internal: true
secrets:
  database_url:
    file: ../secrets/database_url
  tls_certificate:
    file: ../secrets/tls.crt
  tls_key:
    file: ../secrets/tls.key
