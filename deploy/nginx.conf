events { worker_connections 256; }
http {
    server_tokens off;
    # Never log URL paths, query strings, Authorization, or request bodies.
    log_format safe '$remote_addr $request_method $status $request_time';
    access_log /dev/stdout safe;
    error_log /dev/stderr crit;
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=clients:10m;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 10s;
    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        limit_req zone=api burst=10 nodelay;
        limit_conn clients 10;
        location /api/v0/admin/ { return 403; }
        location /docs { return 404; }
        location /openapi.json { return 404; }
        location / {
            proxy_pass http://api:8000;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 15s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header Cache-Control;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;
        }
    }
}
