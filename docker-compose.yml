services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: rie
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rie_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rie -d rie"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  rie_data:

